<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>몽글몽글 벽돌깨기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff4f8; --dot: #ffd9e6; --ink: #5a4a5e; --muted: #a08aa6;
    --pink: #ff8fb1; --pink-deep: #f36f9a; --cream: #fffaf2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    background-image: radial-gradient(var(--dot) 2px, transparent 2.5px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: "Jua", system-ui, "Malgun Gothic", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 16px 16px;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  h1 { margin: 2px 0 8px; font-size: 26px; font-weight: 400; letter-spacing: 1px; color: var(--pink-deep);
    text-shadow: 2px 2px 0 #fff; }
  .hud { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 10px; }
  .pill { background: #fff; border-radius: 999px; padding: 5px 12px; font-size: 15px;
    box-shadow: 0 2px 0 #f6c9d8; white-space: nowrap; }
  .pill b { font-weight: 400; color: var(--pink-deep); }
  .pill.btn { cursor: pointer; border: 0; font: inherit; color: inherit; }
  .wrap { position: relative; width: min(480px, 100%, max(280px, (100vh - 170px) * 0.75)); }
  canvas { display: block; width: 100%; height: auto; border-radius: 24px;
    border: 4px solid #fff; box-shadow: 0 8px 0 #f6c9d8, 0 14px 30px rgba(243,111,154,.18); }
  .overlay { position: absolute; inset: 4px; border-radius: 20px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 20px;
    background: rgba(255, 244, 248, .82); backdrop-filter: blur(3px); }
  .overlay.hidden { display: none; }
  .overlay .emoji { font-size: 54px; animation: bob 1.2s ease-in-out infinite; }
  .overlay h2 { margin: 6px 0 6px; font-size: 30px; font-weight: 400; color: var(--pink-deep); }
  .overlay p { margin: 3px 0; font-size: 17px; color: var(--muted); }
  .overlay button { margin-top: 18px; padding: 12px 34px; font: inherit; font-size: 20px; border: 0;
    border-radius: 999px; background: var(--pink); color: #fff; cursor: pointer;
    box-shadow: 0 5px 0 var(--pink-deep); transition: transform .08s; }
  .overlay button:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--pink-deep); }
  .help { margin-top: 14px; font-size: 14px; color: var(--muted); text-align: center; line-height: 1.6; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-8px) rotate(4deg); } }
</style>
</head>
<body>
<h1>🍬 몽글몽글 벽돌깨기 🍬</h1>
<div class="hud">
  <span class="pill" id="lives">💗💗💗</span>
  <span class="pill">점수 <b id="score">0</b></span>
  <span class="pill">레벨 <b id="level">1</b></span>
  <span class="pill">최고 <b id="best">0</b></span>
  <button class="pill btn" id="mute" aria-label="소리 켜기/끄기">🔊</button>
</div>
<div class="wrap">
  <canvas id="c" width="480" height="640"></canvas>
  <div class="overlay" id="overlay">
    <div class="emoji" id="ovEmoji">🐣</div>
    <h2 id="ovTitle">몽글몽글 벽돌깨기</h2>
    <p id="ovText">웃고 있는 벽돌들을 톡톡 깨 주세요!</p>
    <button id="ovBtn">시작하기 ♪</button>
  </div>
</div>
<div class="help">
  마우스·손가락 또는 ← → 키로 움직이고, 클릭·탭·스페이스로 발사!<br>
  💗 생명 +1 · 🍭 패들이 길어져요 · ⭐ 공이 늘어나요 · P 일시정지
</div>

<script>
(() => {
  const W = 480, H = 640;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const overlay = $('overlay');
  const INK = '#5a4a5e';
  const FONT = '"Jua", system-ui, sans-serif';

  // ---------- 레벨 ----------
  const COLS = 8, GAP = 6, BH = 26, TOP = 72;
  const BW = Math.floor((W - 40 - (COLS - 1) * GAP) / COLS);
  const LEFT = (W - (COLS * BW + (COLS - 1) * GAP)) / 2;
  const COLORS = ['#ffadc6', '#ffc8a2', '#fff0a0', '#b9f2c4', '#a9def9', '#d0c4ff'];
  const PATTERNS = [
    ['.11..11.', '11111111', '11111111', '.111111.', '..1111..', '...11...'],          // 하트
    ['1......1', '11....11', '11111111', '1.1111.1', '11111111', '.111111.'],          // 고양이
    ['22222222', '1.1.1.1.', '.1.1.1.1', '11111111', '22....22', '11111111'],
    ['11111111', '12222221', '12111121', '12111121', '12222221', '11111111'],
    ['.1....1.', '.1....1.', '.111111.', '11.11.11', '11111111', '.122221.'],          // 토끼
  ];

  // ---------- 상태 ----------
  const paddle = { w: 96, targetW: 96, h: 18, x: W / 2 - 48, y: H - 56, speed: 8, squish: 0, wideUntil: 0 };
  let balls = [], bricks = [], powerups = [], particles = [];
  let score = 0, lives = 3, level = 1, state = 'menu', tick = 0;
  const keys = {};
  const clouds = Array.from({ length: 5 }, (_, i) => ({ x: Math.random() * W, y: 40 + i * 120, s: .6 + Math.random() * .6, v: .15 + Math.random() * .2 }));

  let best = 0, muted = false;
  try { best = +localStorage.getItem('cuteBrickBest') || 0; muted = localStorage.getItem('cuteBrickMuted') === '1'; } catch (e) {}
  $('best').textContent = best;
  $('mute').textContent = muted ? '🔇' : '🔊';

  // ---------- 소리 ----------
  let actx = null;
  function sfx(notes, type = 'sine', dur = .09, vol = .07) {
    if (muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { return; }
    const t = actx.currentTime;
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      const st = t + i * dur * .8;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, st);
      g.gain.exponentialRampToValueAtTime(vol, st + .01);
      g.gain.exponentialRampToValueAtTime(.0001, st + dur);
      o.connect(g).connect(actx.destination);
      o.start(st); o.stop(st + dur + .02);
    });
  }
  const PENTA = [523, 587, 659, 784, 880, 1047];
  $('mute').addEventListener('click', () => {
    muted = !muted;
    $('mute').textContent = muted ? '🔇' : '🔊';
    try { localStorage.setItem('cuteBrickMuted', muted ? '1' : '0'); } catch (e) {}
    sfx([660, 880]);
  });

  // ---------- 게임 흐름 ----------
  function buildLevel(n) {
    bricks = [];
    const pat = PATTERNS[(n - 1) % PATTERNS.length];
    const extraHard = Math.floor((n - 1) / PATTERNS.length);   // 한 바퀴 돌 때마다 단단한 줄이 늘어남
    pat.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        if (ch === '.') return;
        const hp = ch === '2' || r < extraHard * 2 ? 2 : 1;
        bricks.push({ x: LEFT + c * (BW + GAP), y: TOP + r * (BH + GAP), hp, maxHp: hp, hurt: false, wob: 0,
          color: COLORS[r % COLORS.length], blink: Math.random() * 400 });
      });
    });
  }

  function ballSpeed() { return Math.min(4.6 + level * .4, 8); }

  function resetBalls() {
    balls = [{ x: paddle.x + paddle.w / 2, y: paddle.y - 10, vx: 0, vy: 0, r: 9, stuck: true, trail: [] }];
  }

  function launch() {
    let launched = false;
    for (const b of balls) {
      if (!b.stuck) continue;
      const ang = (Math.random() * .6 - .3) - Math.PI / 2;
      b.vx = Math.cos(ang) * ballSpeed();
      b.vy = Math.sin(ang) * ballSpeed();
      b.stuck = false; launched = true;
    }
    if (launched) sfx([784, 1047], 'triangle');
  }

  function hud() {
    $('score').textContent = score;
    $('level').textContent = level;
    $('lives').textContent = '💗'.repeat(lives) + '🤍'.repeat(Math.max(0, 3 - lives));
  }

  function showOverlay(emoji, title, text, btn) {
    $('ovEmoji').textContent = emoji; $('ovTitle').textContent = title;
    $('ovText').textContent = text; $('ovBtn').textContent = btn;
    overlay.classList.remove('hidden');
  }

  function beginLevel() {
    buildLevel(level); resetBalls(); powerups = [];
    paddle.targetW = 96; paddle.wideUntil = 0;
    hud(); overlay.classList.add('hidden'); state = 'play';
  }

  function startGame() { score = 0; lives = 3; level = 1; particles = []; beginLevel(); sfx([523, 659, 784], 'triangle'); }

  function gameOver() {
    state = 'over';
    if (score > best) {
      best = score; $('best').textContent = best;
      try { localStorage.setItem('cuteBrickBest', best); } catch (e) {}
    }
    sfx([523, 440, 349, 262], 'triangle', .16);
    showOverlay('😢', '아이고, 끝났어요', `점수 ${score} · 최고 ${best}`, '다시 하기 ♪');
  }

  function togglePause() {
    if (state === 'play') { state = 'pause'; showOverlay('☕', '잠깐 쉬어요', '준비되면 계속해요!', '계속하기 ▶'); }
    else if (state === 'pause') { state = 'play'; overlay.classList.add('hidden'); }
  }

  $('ovBtn').addEventListener('click', () => {
    if (state === 'clear') { level++; beginLevel(); sfx([659, 784, 1047], 'triangle'); }
    else if (state === 'pause') togglePause();
    else startGame();
  });

  // ---------- 입력 ----------
  function toCanvasX(clientX) {
    const rect = cv.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  function movePaddleTo(x) { paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2)); }

  cv.addEventListener('mousemove', e => { if (state === 'play') movePaddleTo(toCanvasX(e.clientX)); });
  cv.addEventListener('mousedown', () => { if (state === 'play') launch(); });
  cv.addEventListener('touchstart', e => {
    if (state !== 'play') return;
    movePaddleTo(toCanvasX(e.touches[0].clientX)); launch(); e.preventDefault();
  }, { passive: false });
  cv.addEventListener('touchmove', e => {
    if (state === 'play') movePaddleTo(toCanvasX(e.touches[0].clientX));
    e.preventDefault();
  }, { passive: false });
  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ') {
      e.preventDefault();
      if (state === 'play') launch(); else if (state !== 'pause') $('ovBtn').click();
    }
    if (e.key === 'p' || e.key === 'P') togglePause();
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  // ---------- 효과 ----------
  function burst(x, y, color, n = 10) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 3;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 40, max: 40,
        color, ch: Math.random() < .5 ? '♥' : '✦', size: 10 + Math.random() * 8 });
    }
  }
  function floatText(x, y, text) {
    particles.push({ x, y, vx: 0, vy: -1.2, life: 50, max: 50, color: '#f36f9a', ch: text, size: 18, text: true });
  }

  const POWERS = [
    { kind: 'life', emoji: '💗' },
    { kind: 'wide', emoji: '🍭' },
    { kind: 'multi', emoji: '⭐' },
  ];

  function applyPower(p) {
    sfx([784, 988, 1175, 1568], 'triangle', .08);
    burst(p.x, p.y, '#ffd166', 8);
    if (p.kind === 'life') { lives = Math.min(lives + 1, 5); floatText(p.x, p.y - 10, '생명 +1'); }
    if (p.kind === 'wide') { paddle.targetW = 150; paddle.wideUntil = tick + 60 * 10; floatText(p.x, p.y - 10, '쭈욱~'); }
    if (p.kind === 'multi') {
      launch();
      const extra = [];
      for (const b of balls) {
        for (const da of [-.45, .45]) {
          if (balls.length + extra.length >= 6) break;
          const c = Math.cos(da), s = Math.sin(da);
          extra.push({ x: b.x, y: b.y, r: b.r, stuck: false, trail: [], vx: b.vx * c - b.vy * s, vy: b.vx * s + b.vy * c });
        }
      }
      balls.push(...extra);
      floatText(p.x, p.y - 10, '공이 늘었다!');
    }
    hud();
  }

  // ---------- 업데이트 ----------
  function hitBrick(i) {
    const b = bricks[i];
    b.hp--; b.wob = 1;
    if (b.hp <= 0) {
      bricks.splice(i, 1);
      burst(b.x + BW / 2, b.y + BH / 2, b.color);
      score += 10 * level;
      sfx([PENTA[Math.floor(Math.random() * PENTA.length)]], 'sine', .12, .08);
      if (Math.random() < .14) {
        const p = POWERS[Math.floor(Math.random() * POWERS.length)];
        powerups.push({ ...p, x: b.x + BW / 2, y: b.y + BH / 2, vy: 2.2 });
      }
    } else {
      b.hurt = true; score += 5;
      sfx([330], 'square', .07, .04);
    }
    hud();
  }

  function updateBall(ball) {
    if (ball.stuck) { ball.x = paddle.x + paddle.w / 2; ball.y = paddle.y - ball.r - 1; return; }

    ball.trail.push({ x: ball.x, y: ball.y });
    if (ball.trail.length > 8) ball.trail.shift();

    // 공이 벽돌을 뚫고 지나가지 않도록 잘게 나눠서 이동
    const steps = Math.ceil(Math.hypot(ball.vx, ball.vy) / 4);
    for (let s = 0; s < steps; s++) {
      ball.x += ball.vx / steps;
      ball.y += ball.vy / steps;

      if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); sfx([440], 'sine', .04, .03); }
      if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); sfx([440], 'sine', .04, .03); }
      if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); sfx([440], 'sine', .04, .03); }

      // 패들에 맞은 위치에 따라 튕기는 각도가 달라짐
      if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 8 &&
          ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
        const hit = Math.max(-1, Math.min(1, (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2)));
        const sp = Math.hypot(ball.vx, ball.vy);
        const ang = hit * (Math.PI / 3);
        ball.vx = sp * Math.sin(ang);
        ball.vy = -sp * Math.cos(ang);
        ball.y = paddle.y - ball.r;
        paddle.squish = 1;
        sfx([392, 523], 'triangle', .06, .06);
      }

      for (let i = 0; i < bricks.length; i++) {
        const b = bricks[i];
        const cx = Math.max(b.x, Math.min(ball.x, b.x + BW));
        const cy = Math.max(b.y, Math.min(ball.y, b.y + BH));
        const dx = ball.x - cx, dy = ball.y - cy;
        if (dx * dx + dy * dy <= ball.r * ball.r) {
          const overlapX = Math.min(ball.x + ball.r - b.x, b.x + BW - (ball.x - ball.r));
          const overlapY = Math.min(ball.y + ball.r - b.y, b.y + BH - (ball.y - ball.r));
          if (overlapX < overlapY) ball.vx = -ball.vx; else ball.vy = -ball.vy;
          const sp = Math.hypot(ball.vx, ball.vy);
          if (sp < 9) { ball.vx *= 1.008; ball.vy *= 1.008; }
          hitBrick(i);
          break;
        }
      }
    }
  }

  function update() {
    tick++;
    if (keys['ArrowLeft']) paddle.x -= paddle.speed;
    if (keys['ArrowRight']) paddle.x += paddle.speed;

    if (paddle.wideUntil && tick > paddle.wideUntil) { paddle.targetW = 96; paddle.wideUntil = 0; }
    const cxp = paddle.x + paddle.w / 2;
    paddle.w += (paddle.targetW - paddle.w) * .15;
    paddle.x = Math.max(0, Math.min(W - paddle.w, cxp - paddle.w / 2));
    paddle.squish *= .85;

    balls.forEach(updateBall);
    balls = balls.filter(b => b.y - b.r <= H);

    if (balls.length === 0) {
      lives--; hud();
      if (lives <= 0) return gameOver();
      sfx([392, 330], 'triangle', .14);
      floatText(W / 2, H / 2, '앗! 💦');
      powerups = []; paddle.targetW = 96; paddle.wideUntil = 0;
      resetBalls();
    }

    for (const p of powerups) {
      p.y += p.vy;
      if (p.y + 14 >= paddle.y && p.y - 14 <= paddle.y + paddle.h && p.x >= paddle.x - 10 && p.x <= paddle.x + paddle.w + 10) {
        p.caught = true; applyPower(p);
      }
    }
    powerups = powerups.filter(p => !p.caught && p.y < H + 20);

    for (const b of bricks) b.wob *= .88;

    for (const p of particles) { p.x += p.vx; p.y += p.vy; if (!p.text) p.vy += .08; p.life--; }
    particles = particles.filter(p => p.life > 0);

    if (bricks.length === 0) {
      state = 'clear';
      score += 100 * level; hud();
      sfx([523, 659, 784, 1047, 1319], 'triangle', .11);
      showOverlay('🎉', `레벨 ${level} 클리어!`, `보너스 +${100 * level} · 점수 ${score}`, '다음 레벨 ▶');
    }
  }

  // ---------- 그리기 ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#dff3ff'); g.addColorStop(1, '#ffe8f1');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    for (const c of clouds) {
      if (state === 'play' || state === 'menu') { c.x += c.v; if (c.x > W + 80) c.x = -80; }
      ctx.beginPath();
      ctx.arc(c.x, c.y, 18 * c.s, 0, Math.PI * 2);
      ctx.arc(c.x + 22 * c.s, c.y - 8 * c.s, 22 * c.s, 0, Math.PI * 2);
      ctx.arc(c.x + 46 * c.s, c.y, 18 * c.s, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawFace(eyeGap, eyeY, mouthY, blinking, hurt, scale = 1) {
    ctx.fillStyle = INK; ctx.strokeStyle = INK; ctx.lineCap = 'round';
    if (hurt) {
      ctx.lineWidth = 1.8 * scale; ctx.beginPath();
      ctx.moveTo(-eyeGap - 3 * scale, eyeY - 3 * scale); ctx.lineTo(-eyeGap + 1 * scale, eyeY); ctx.lineTo(-eyeGap - 3 * scale, eyeY + 3 * scale);
      ctx.moveTo(eyeGap + 3 * scale, eyeY - 3 * scale); ctx.lineTo(eyeGap - 1 * scale, eyeY); ctx.lineTo(eyeGap + 3 * scale, eyeY + 3 * scale);
      ctx.stroke();
    } else if (blinking) {
      ctx.lineWidth = 1.8 * scale; ctx.beginPath();
      ctx.moveTo(-eyeGap - 2.5 * scale, eyeY); ctx.lineTo(-eyeGap + 2.5 * scale, eyeY);
      ctx.moveTo(eyeGap - 2.5 * scale, eyeY); ctx.lineTo(eyeGap + 2.5 * scale, eyeY);
      ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(-eyeGap, eyeY, 2.4 * scale, 0, Math.PI * 2); ctx.arc(eyeGap, eyeY, 2.4 * scale, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-eyeGap + .8 * scale, eyeY - .8 * scale, .8 * scale, 0, Math.PI * 2); ctx.arc(eyeGap + .8 * scale, eyeY - .8 * scale, .8 * scale, 0, Math.PI * 2); ctx.fill();
    }
    ctx.lineWidth = 1.6 * scale; ctx.beginPath();
    ctx.arc(-2.2 * scale, mouthY, 2.2 * scale, 0, Math.PI); ctx.arc(2.2 * scale, mouthY, 2.2 * scale, 0, Math.PI);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,120,160,.45)';
    ctx.beginPath(); ctx.arc(-eyeGap - 6 * scale, mouthY, 3.2 * scale, 0, Math.PI * 2); ctx.arc(eyeGap + 6 * scale, mouthY, 3.2 * scale, 0, Math.PI * 2); ctx.fill();
  }

  function drawBrick(b, now) {
    const s = 1 + Math.sin(b.wob * Math.PI * 4) * .12 * b.wob;
    ctx.save();
    ctx.translate(b.x + BW / 2, b.y + BH / 2);
    ctx.scale(s, 2 - s);
    ctx.fillStyle = 'rgba(160,110,150,.18)'; rr(-BW / 2, -BH / 2 + 4, BW, BH, 10); ctx.fill();
    ctx.fillStyle = b.color; rr(-BW / 2, -BH / 2, BW, BH, 10); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.5)'; rr(-BW / 2 + 6, -BH / 2 + 3, BW - 20, 5, 3); ctx.fill();
    if (b.hp > 1) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.setLineDash([5, 4]);
      rr(-BW / 2 + 2, -BH / 2 + 2, BW - 4, BH - 4, 8); ctx.stroke(); ctx.setLineDash([]);
    }
    const blinking = ((now + b.blink * 10) % 3600) < 130;
    drawFace(7, 0, 4, blinking, b.hurt);
    ctx.restore();
  }

  function drawPaddle(now) {
    const sq = paddle.squish;
    ctx.save();
    ctx.translate(paddle.x + paddle.w / 2, paddle.y + paddle.h / 2);
    ctx.scale(1 + sq * .12, 1 - sq * .25);
    const w = paddle.w, h = paddle.h;
    ctx.fillStyle = 'rgba(160,110,150,.2)'; rr(-w / 2, -h / 2 + 5, w, h, h / 2); ctx.fill();
    const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
    g.addColorStop(0, '#ff9fc0'); g.addColorStop(1, '#c6a8ff');
    ctx.fillStyle = g; rr(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.55)'; rr(-w / 2 + 10, -h / 2 + 3, w - 30, 4, 2); ctx.fill();
    drawFace(9, -1, 3, (now % 3000) < 140, false, 1.1);
    ctx.restore();
  }

  function drawBall(b) {
    b.trail.forEach((t, i) => {
      ctx.fillStyle = `rgba(255,143,177,${(i + 1) / b.trail.length * .25})`;
      ctx.beginPath(); ctx.arc(t.x, t.y, b.r * (i + 1) / b.trail.length, 0, Math.PI * 2); ctx.fill();
    });
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#ff8fb1'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffd1e0';
    ctx.beginPath(); ctx.arc(b.x - 3, b.y - 3, 2.6, 0, Math.PI * 2); ctx.fill();
  }

  function drawPowerup(p, now) {
    const bob = Math.sin(now / 150 + p.x) * 3;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(p.x, p.y + bob, 15, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ffc2d6'; ctx.lineWidth = 2; ctx.stroke();
    ctx.font = `18px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.emoji, p.x, p.y + bob + 1);
  }

  function draw(now) {
    drawBackground();
    for (const b of bricks) drawBrick(b, now);
    for (const p of powerups) drawPowerup(p, now);
    drawPaddle(now);
    for (const b of balls) drawBall(b);

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const p of particles) {
      ctx.globalAlpha = Math.min(1, p.life / p.max * 1.5);
      ctx.fillStyle = p.color;
      ctx.font = `${p.size}px ${FONT}`;
      if (p.text) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.strokeText(p.ch, p.x, p.y); }
      ctx.fillText(p.ch, p.x, p.y);
    }
    ctx.globalAlpha = 1;

    if (state === 'play' && balls.some(b => b.stuck)) {
      ctx.font = `20px ${FONT}`; ctx.fillStyle = '#f36f9a';
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 5;
      ctx.strokeText('탭해서 발사! ✨', W / 2, H / 2 + 80);
      ctx.fillText('탭해서 발사! ✨', W / 2, H / 2 + 80);
    }
  }

  // ---------- 루프 (화면 주사율과 관계없이 초당 60번 업데이트) ----------
  const STEP = 1000 / 60;
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(100, now - last); last = now;
    while (acc >= STEP) { if (state === 'play') update(); acc -= STEP; }
    draw(now);
    requestAnimationFrame(loop);
  }

  buildLevel(1); resetBalls(); hud();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
